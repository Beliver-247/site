name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "vehicle-rent-frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "vehicle-rent-frontend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicle-rent-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vehicle-rent-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: vehicle-rent-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vehicle-rent-frontend:latest
