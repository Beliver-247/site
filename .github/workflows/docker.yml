name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, user-service, vehicle-service, booking-service, notification-service]
        include:
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
          - service: user-service
            dockerfile: user-service/Dockerfile
          - service: vehicle-service
            dockerfile: vehicle-service/Dockerfile
          - service: booking-service
            dockerfile: booking-service/Dockerfile
          - service: notification-service
            dockerfile: notification-service/Dockerfile

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
