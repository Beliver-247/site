version: '3.9'

services:
  user-service:
    image: hiranx/user-service:latest
    container_name: user-service
    ports:
      - "8181:8181"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MONGODB_URI_USER: ${MONGODB_URI_USER}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-environment-at-least-32-characters-long}
      JWT_EXPIRATION: 86400000
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vehicle-service:
    image: hiranx/vehicle-service:latest
    container_name: vehicle-service
    ports:
      - "8182:8182"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MONGODB_URI_VEHICLE: ${MONGODB_URI_VEHICLE}
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  booking-service:
    image: hiranx/booking-service:latest
    container_name: booking-service
    ports:
      - "8183:8183"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MONGODB_URI_BOOKING: ${MONGODB_URI_BOOKING}
      USER_SERVICE_URL: http://user-service:8181
      VEHICLE_SERVICE_URL: http://vehicle-service:8182
      NOTIFICATION_SERVICE_URL: http://notification-service:8184
    depends_on:
      - user-service
      - vehicle-service
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8183/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service:
    image: hiranx/notification-service:latest
    container_name: notification-service
    ports:
      - "8184:8184"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MONGODB_URI_NOTIFICATION: ${MONGODB_URI_NOTIFICATION}
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8184/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    image: hiranx/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8180:8180"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-environment-at-least-32-characters-long}
      USER_SERVICE_URL: http://user-service:8181
      VEHICLE_SERVICE_URL: http://vehicle-service:8182
      BOOKING_SERVICE_URL: http://booking-service:8183
      NOTIFICATION_SERVICE_URL: http://notification-service:8184
    depends_on:
      - user-service
      - vehicle-service
      - booking-service
      - notification-service
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vehicle-rent-frontend:
    image: hiranx/vehicle-rent-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - vehicle-rental-network

networks:
  vehicle-rental-network:
    driver: bridge
