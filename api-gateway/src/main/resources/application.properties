spring.application.name=api-gateway
server.port=8180

# Force reactive mode (required for Spring Cloud Gateway)
spring.main.web-application-type=reactive

# Disable the Spring MVC check that incorrectly detects MVC when using webflux
spring.cloud.gateway.enabled=true
spring.autoconfigure.exclude=org.springframework.cloud.gateway.config.GatewayClassPathWarningAutoConfiguration

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-environment-at-least-32-characters-long}

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# Gateway
spring.cloud.gateway.default-filters=
spring.cloud.gateway.httpclient.ssl.useInsecureTrustManager=true

# Logging
logging.level.root=INFO
logging.level.com.fastFleet=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
